<script>
    const PROFILE_STORAGE_KEY = "porto_dossier_2026_v1";

    function toggleModal(show) {
      const modal = document.getElementById("editor-modal");
      if (!modal) return;
      if (show) {
        syncInputsFromCurrentDisplay();
        modal.classList.remove("hidden");
      } else {
        modal.classList.add("hidden");
      }
    }

    function getDefaultProfileData() {
      const skillSpans = Array.from(document.querySelectorAll("#display-skills span"));
      const skillsText = skillSpans.map((el) => el.textContent.trim()).filter(Boolean).join(", ");

      return {
        name: document.getElementById("display-name")?.textContent.trim() || "ADIT SATRIA WIBOWO",
        nim: document.getElementById("display-nim")?.textContent.trim() || "231091900149",
        ttl: document.getElementById("display-ttl")?.textContent.trim() || "Kuala Tungkal, 08 Oktober 2004",
        gender: document.getElementById("display-gender")?.textContent.trim() || "Laki-Laki",
        address: document.getElementById("display-address")?.textContent.trim() || "Kuala Tungkal, Jambi, Indonesia",
        year: document.getElementById("display-year-1")?.textContent.trim() || "2026",
        role: document.getElementById("display-role-1")?.textContent.trim() || "CYBERSECURITY & SYSTEM COMPUTER ENGINEER",
        avatar: document.getElementById("display-avatar-hero")?.getAttribute("src") || "WhatsApp Image 2026-11-10 at 10.21.45.jpeg",
        bio: document.getElementById("display-bio")?.textContent.trim() || "",
        skills: skillsText || "C++, JavaScript, SCADA / PLC, Python, Arduino IDE, Network Encryption",
        ig: document.getElementById("soc-ig")?.textContent.trim() || "@aditsatriaa_w"
      };
    }

    const DEFAULT_PROFILE = getDefaultProfileData();

    function renderSkills(skillsInput) {
      const container = document.getElementById("display-skills");
      if (!container) return;

      const items = String(skillsInput || "")
        .split(",")
        .map((s) => s.trim())
        .filter(Boolean);

      if (items.length === 0) return;

      container.innerHTML = items
        .map(
          (skill) =>
            `<span class="bg-cyan-950/80 text-cyan-300 border border-cyan-500/40 px-3 py-1.5 rounded text-xs font-mono-tech">${escapeHtml(skill)}</span>`
        )
        .join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function applyProfileToDOM(data) {
      const merged = { ...DEFAULT_PROFILE, ...(data || {}) };

      if (document.getElementById("display-name")) {
        document.getElementById("display-name").textContent = merged.name;
      }
      if (document.getElementById("display-nim")) {
        document.getElementById("display-nim").textContent = merged.nim;
      }
      if (document.getElementById("display-ttl")) {
        document.getElementById("display-ttl").textContent = merged.ttl;
      }
      if (document.getElementById("display-gender")) {
        document.getElementById("display-gender").textContent = merged.gender;
      }
      if (document.getElementById("display-address")) {
        document.getElementById("display-address").textContent = merged.address;
      }
      if (document.getElementById("display-year-1")) {
        document.getElementById("display-year-1").textContent = merged.year;
      }
      document.querySelectorAll(".project-year-label").forEach((el) => {
        el.textContent = merged.year;
      });
      if (document.getElementById("display-role-1")) {
        document.getElementById("display-role-1").textContent = merged.role;
      }
      if (document.getElementById("display-bio")) {
        document.getElementById("display-bio").textContent = merged.bio;
      }
      if (document.getElementById("soc-ig")) {
        document.getElementById("soc-ig").textContent = merged.ig;
      }

      const igLink = document.querySelector('a[href*="instagram.com"]');
      if (igLink && merged.ig) {
        const cleanHandle = merged.ig.replace(/^@/, "").trim();
        if (cleanHandle) {
          igLink.href = `https://instagram.com/${encodeURIComponent(cleanHandle)}`;
        }
      }

      if (merged.avatar) {
        const heroImg = document.getElementById("display-avatar-hero");
        const profilImg = document.getElementById("display-avatar-profil");
        if (heroImg) heroImg.src = merged.avatar;
        if (profilImg) profilImg.src = merged.avatar;
      }

      renderSkills(merged.skills);
    }

    function syncInputsFromCurrentDisplay() {
      const current = loadSavedProfile() || DEFAULT_PROFILE;
      if (document.getElementById("input-name")) document.getElementById("input-name").value = current.name;
      if (document.getElementById("input-nim")) document.getElementById("input-nim").value = current.nim;
      if (document.getElementById("input-ttl")) document.getElementById("input-ttl").value = current.ttl;
      if (document.getElementById("input-gender")) document.getElementById("input-gender").value = current.gender;
      if (document.getElementById("input-address")) document.getElementById("input-address").value = current.address;
      if (document.getElementById("input-year")) document.getElementById("input-year").value = current.year;
      if (document.getElementById("input-role")) document.getElementById("input-role").value = current.role;
      if (document.getElementById("input-avatar")) document.getElementById("input-avatar").value = current.avatar;
      if (document.getElementById("input-bio")) document.getElementById("input-bio").value = current.bio;
      if (document.getElementById("input-skills")) document.getElementById("input-skills").value = current.skills;
      if (document.getElementById("input-ig")) document.getElementById("input-ig").value = current.ig;

      const fileInput = document.getElementById("input-file-photo");
      if (fileInput) fileInput.value = "";
    }

    function loadSavedProfile() {
      try {
        const raw = localStorage.getItem(PROFILE_STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (err) {
        console.warn("Gagal membaca localStorage:", err);
        return null;
      }
    }

    function saveProfileToStorage(data) {
      try {
        localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(data));
        return true;
      } catch (err) {
        console.warn("Gagal menyimpan ke localStorage (mungkin ukuran file terlalu besar):", err);
        return false;
      }
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    async function saveBiodata(event) {
      event.preventDefault();

      const current = loadSavedProfile() || DEFAULT_PROFILE;
      const fileInput = document.getElementById("input-file-photo");
      let avatarValue = document.getElementById("input-avatar")?.value.trim() || current.avatar;

      if (fileInput && fileInput.files && fileInput.files[0]) {
        try {
          avatarValue = await readFileAsDataURL(fileInput.files[0]);
        } catch (err) {
          console.warn("Gagal membaca file foto:", err);
        }
      }

      const updated = {
        name: document.getElementById("input-name")?.value.trim() || current.name,
        nim: document.getElementById("input-nim")?.value.trim() || current.nim,
        ttl: document.getElementById("input-ttl")?.value.trim() || current.ttl,
        gender: document.getElementById("input-gender")?.value.trim() || current.gender,
        address: document.getElementById("input-address")?.value.trim() || current.address,
        year: document.getElementById("input-year")?.value.trim() || current.year,
        role: document.getElementById("input-role")?.value.trim() || current.role,
        avatar: avatarValue,
        bio: document.getElementById("input-bio")?.value.trim() || current.bio,
        skills: document.getElementById("input-skills")?.value.trim() || current.skills,
        ig: document.getElementById("input-ig")?.value.trim() || current.ig
      };

      const saved = saveProfileToStorage(updated);
      applyProfileToDOM(updated);

      if (!saved && fileInput && fileInput.files && fileInput.files[0]) {
        alert("Foto tampil di sesi ini, tetapi ukurannya terlalu besar untuk disimpan permanen di localStorage. Gunakan foto yang lebih kecil atau URL gambar.");
      }

      toggleModal(false);
    }

    function resetBiodataDefault() {
      try {
        localStorage.removeItem(PROFILE_STORAGE_KEY);
      } catch (err) {
        console.warn("Gagal menghapus localStorage:", err);
      }
      applyProfileToDOM(DEFAULT_PROFILE);
      syncInputsFromCurrentDisplay();
      toggleModal(false);
    }

    // Tambahkan tombol Reset Default otomatis di sebelah tombol Simpan Perubahan
    document.addEventListener("DOMContentLoaded", () => {
      const saved = loadSavedProfile();
      if (saved) {
        applyProfileToDOM(saved);
      }

      const modalForm = document.querySelector("#editor-modal form");
      const actionBar = modalForm?.querySelector(".flex.justify-end");
      if (actionBar && !document.getElementById("btn-reset-biodata")) {
        const resetBtn = document.createElement("button");
        resetBtn.type = "button";
        resetBtn.id = "btn-reset-biodata";
        resetBtn.textContent = "Reset Default";
        resetBtn.className = "mr-auto px-4 py-2 bg-slate-900 hover:bg-slate-800 text-amber-400 border border-amber-500/40 rounded";
        resetBtn.addEventListener("click", resetBiodataDefault);
        actionBar.prepend(resetBtn);
      }

      // Partikel latar belakang ringan pada #bio-canvas
      const canvas = document.getElementById("bio-canvas");
      if (canvas && canvas.getContext) {
        const ctx = canvas.getContext("2d");
        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener("resize", resize);

        const particles = Array.from({ length: 28 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 2 + 0.8,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4
        }));

        function tick() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "rgba(239, 68, 68, 0.35)";
          for (const p of particles) {
            p.x = (p.x + p.vx + canvas.width) % canvas.width;
            p.y = (p.y + p.vy + canvas.height) % canvas.height;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          requestAnimationFrame(tick);
        }
        tick();
      }
    });
  </script>
</body>
</html>
